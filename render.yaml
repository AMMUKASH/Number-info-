services:
  - type: web
    name: nmbr-info-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        value: "38138069"
      - key: API_HASH
        sync: false
      - key: OWNER_ID
        value: "8724182918"
      - key: LOG_GROUP_ID
        value: "-1003947649552"
